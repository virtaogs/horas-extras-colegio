name: Supabase keep-alive

# Projetos gratuitos do Supabase pausam depois de ~7 dias sem atividade.
# Essa rotina só faz uma consulta simples de vez em quando pra evitar isso.
on:
  schedule:
    - cron: '0 8 */5 * *' # a cada 5 dias, 08h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta simples no Supabase
        run: |
          curl -sf "${SUPABASE_URL}/rest/v1/feriados?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w "status: %{http_code}\n"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
